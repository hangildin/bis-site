name: Deploy BIS main site with V2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bis-primary-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'hangildin/bis-site'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://hangildin.github.io/bis-site/
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify primary commercial site
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/check_release.py
          python3 scripts/build_release.py --base-url https://hangildin.github.io/bis-site/ --publish --allow-primary-site --out dist
          python3 scripts/optimize_release.py --dist dist
          BIS_PRODUCTION_URL=https://hangildin.github.io/bis-site/ python3 scripts/check_dist.py dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish BIS V2 on primary address
        id: deployment
        uses: actions/deploy-pages@v4
